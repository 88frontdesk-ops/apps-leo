<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Weather</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">W</span><div><strong>Weather</strong><span>Live conditions</span></div></div>
      <button id="gps-btn" class="icon-btn" title="Use current location" aria-label="Use current location">⌖</button>
    </header>

    <div class="search-bar">
      <span class="search-icon">⌕</span>
      <input type="text" id="city-input" placeholder="City, ZIP code or place…" autocomplete="off">
      <button id="search-btn">Search</button>
    </div>

    <div id="loader" class="loader"><span class="spinner"></span><span>Loading weather…</span></div>

    <section id="content" class="hidden">
      <div id="search-results-list"></div>

      <section class="hero-card">
        <div class="hero-copy">
          <div class="eyebrow"><span class="status-dot"></span><span id="location-name">—</span><span id="updated-at"></span></div>
          <div class="hero-temp"><span id="current-temp">--</span><sup>°C</sup></div>
          <div id="short-forecast" class="condition">—</div>
          <div class="range"><span>H <b id="today-high">--°</b></span><span>L <b id="today-low">--°</b></span></div>
        </div>
        <div class="hero-icon-wrap"><img id="weather-icon" src="" alt="Current weather"></div>
      </section>

      <section class="section">
        <div class="section-title"><h2>Today</h2><span id="today-date">—</span></div>
        <div class="hourly-container" id="hourly-forecast"></div>
      </section>

      <section class="section">
        <div class="section-title"><h2>At a glance</h2><span>Current</span></div>
        <div class="metrics-grid">
          <div class="metric"><span class="metric-icon">◉</span><div><label>Feels like</label><strong id="feels-like">--°</strong></div></div>
          <div class="metric"><span class="metric-icon">◌</span><div><label>Humidity</label><strong id="humidity">--%</strong></div></div>
          <div class="metric"><img class="metric-icon-img" src="assets/thermometer.svg" alt=""><div><label>Pressure</label><strong id="pressure">-- hPa</strong></div></div>
          <div class="metric"><img class="metric-icon-img wind-arrow" id="wind-arrow" src="assets/arrow.svg" alt=""><div><label>Wind</label><strong id="wind">--</strong></div></div>
          <div class="metric"><span class="metric-icon">☁</span><div><label>Cloud cover</label><strong id="cloud-cover">--%</strong></div></div>
          <div class="metric"><span class="metric-icon">◒</span><div><label>Visibility</label><strong id="visibility">-- km</strong></div></div>
        </div>
      </section>

      <section class="section sun-card">
        <div class="sun-row"><span>☀</span><div><label>Sunrise</label><strong id="sunrise">--:--</strong></div><div class="sun-line"><i></i></div><div><label>Sunset</label><strong id="sunset">--:--</strong></div><span>☾</span></div>
      </section>

      <section class="section">
        <div class="section-title"><h2>7-day forecast</h2><span id="forecast-source">Open-Meteo</span></div>
        <div id="daily-forecast" class="daily-list"></div>
      </section>

      <section class="section details-card">
        <div class="detail-row"><span>UV index</span><strong id="uv-index">--</strong></div>
        <div class="detail-row"><span>Precipitation today</span><strong id="precip-total">-- mm</strong></div>
        <div class="detail-row"><span>Rain chance today</span><strong id="precip-prob">--%</strong></div>
        <div class="detail-row"><span>Moonrise / Moonset</span><strong><span id="moonrise">--:--</span> / <span id="moonset">--:--</span></strong></div>
      </section>
      <footer><span>Data from Open-Meteo</span><span id="last-refresh">—</span></footer>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
