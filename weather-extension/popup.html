<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Weather</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main class="app">
<header class="topbar"><div class="brand"><span class="brand-mark">☁</span><div><strong>Live Weather</strong><span id="data-source">Weather</span></div></div><div class="top-actions"><button id="gps-btn" class="icon-btn" title="Current location">⌖</button><button id="settings-btn" class="icon-btn" title="Settings">⚙</button></div></header>
<div class="search-bar"><span>⌕</span><input id="city-input" placeholder="Search city or place…" autocomplete="off"><button id="search-btn">Search</button></div>
<div id="search-results-list"></div>
<div id="loader" class="loader"><span class="spinner"></span><span>Loading weather…</span></div>
<section id="content" class="hidden">
<section class="hero-card"><div><div class="eyebrow"><span class="status-dot"></span><span id="location-name">—</span><span id="updated-at"></span></div><div class="hero-temp"><span id="current-temp">--</span><sup id="temp-unit">°C</sup></div><div id="short-forecast" class="condition">—</div><div class="range"><span>High <b id="today-high">--°</b></span><span>Low <b id="today-low">--°</b></span></div></div><div class="hero-icon-wrap"><img id="weather-icon" src="assets/clear.svg" alt="Weather condition"></div></section>
<section class="section hourly-section"><div class="section-title"><h2>Hourly</h2><span id="hourly-source">—</span></div><div id="hourly-forecast" class="hourly-container"></div></section>
<section class="description-card"><div class="description-title">Today's conditions</div><p id="condition-description">—</p></section>
<section class="section"><div class="section-title"><h2>Current details</h2><span id="today-date">—</span></div><div class="metrics-grid">
<div class="metric"><span class="metric-icon">◉</span><div><label>Feels like</label><strong id="feels-like">--°</strong></div></div>
<div class="metric"><span class="metric-icon">◌</span><div><label>Humidity</label><strong id="humidity">--%</strong></div></div>
<div class="metric"><img class="metric-icon-img" src="assets/thermometer.svg"><div><label>Pressure</label><strong id="pressure">-- hPa</strong></div></div>
<div class="metric"><img class="metric-icon-img wind-arrow" id="wind-arrow" src="assets/arrow.svg"><div><label>Wind</label><strong id="wind">--</strong></div></div>
<div class="metric"><span class="metric-icon">☁</span><div><label>Cloud</label><strong id="cloud-cover">--%</strong></div></div>
<div class="metric"><span class="metric-icon">◒</span><div><label>Visibility</label><strong id="visibility">-- km</strong></div></div>
</div></section>
<section class="section forecast-section"><div class="section-title"><h2>7-day forecast</h2><span id="forecast-source">—</span></div><div id="daily-forecast" class="daily-list"></div></section>
<section class="astro-strip"><div><small>Sunrise</small><b id="sunrise">--:--</b></div><div><small>Sunset</small><b id="sunset">--:--</b></div><div><small>UV</small><b id="uv-index">--</b></div><div><small>Rain</small><b id="precip-prob">--%</b></div><div><small>Precip.</small><b id="precip-total">--</b></div></section>
<footer><span id="last-refresh">—</span><span>Moon <b id="moonrise">--:--</b> / <b id="moonset">--:--</b></span></footer>
</section>
<div id="settings-panel" class="settings-panel hidden"><div class="settings-head"><b>Settings</b><button id="close-settings">×</button></div><label class="setting"><span><strong>Temperature</strong><small>Celsius is the default.</small></span><select id="temperature-setting"><option value="celsius">Celsius (°C)</option><option value="fahrenheit">Fahrenheit (°F)</option></select></label><label class="setting"><span><strong>Wind</strong><small>Choose speed unit.</small></span><select id="wind-setting"><option value="kmh">km/h</option><option value="mph">mph</option></select></label><label class="setting"><span><strong>Theme</strong><small>Choose appearance.</small></span><select id="theme-setting"><option value="dark">Dark</option><option value="light">Light</option></select></label><button id="use-current-setting" class="primary-setting">Use current location</button><div id="setting-status" class="setting-status">Saved automatically.</div></div>
</main><script src="popup.js"></script></body></html>
